name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: production
    # Ships chromium/firefox/webkit preinstalled, matching our pinned
    # `playwright` devDependency version — no `playwright install` step, no
    # cache key to keep in sync with that version by hand.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # GitHub Actions sets HOME=/github/home for containers, owned by
      # `pwuser`, but this image runs as root — Firefox refuses to launch
      # as root in a $HOME it doesn't own. Documented Playwright workaround.
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check (format, lint, typecheck, svelte)
        run: pnpm run check

      - name: Tests (node + Chromium/Firefox/WebKit)
        run: pnpm test

      - name: Build (Cloudflare adapter)
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
